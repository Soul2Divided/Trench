<section class="crear-publicacion card" aria-labelledby="titulo-crear">
    <div class="crear-publicacion__cabecera">
        <span class="avatar" aria-hidden="true">GL</span>

        <div>
            <h2 id="titulo-crear">¿Qué estás escuchando?</h2>
            <p>Compartí música, ideas y descubrimientos.</p>
        </div>
    </div>

    <div class="form-field">
        <label class="form-label" for="titulo-nuevo">Título</label>
        <input class="form-control" id="titulo-nuevo" type="text" placeholder="Dale un título a tu publicación">
    </div>

    <div class="form-field">
        <label class="form-label" for="mensaje-nuevo">Mensaje</label>
        <textarea class="form-control" id="mensaje-nuevo" rows="3" placeholder="Una canción, un disco, algo que quieras compartir..."></textarea>
    </div>

    <div class="crear-publicacion__acciones">
        <button class="button" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8" cy="8" r="2" />
                <path d="m3 18 6-6 4 4 3-3 5 5" />
            </svg>

            Adjuntar imagen
        </button>

        <button class="button button--primary" type="button">Publicar</button>
    </div>
</section>
