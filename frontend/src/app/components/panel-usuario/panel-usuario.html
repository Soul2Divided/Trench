<aside class="barra-lateral" aria-label="Perfil y navegación">
    <section class="perfil-resumen card" aria-label="Tu perfil">
        @if (usuario(); as datos) {
            <img class="avatar avatar--grande" [src]="datos.imagenPerfilUrl" alt="">

            <div>
                <p class="perfil-resumen__nombre">{{ datos.nombre }} {{ datos.apellido }}</p>
                <p class="perfil-resumen__usuario">&#64;{{ datos.nombreUsuario }}</p>
            </div>
        } @else {
            <a class="button button--primary" routerLink="/">Iniciar sesión</a>
        }
    </section>

    <nav class="navegacion card" aria-label="Navegación principal">
        <p class="navegacion__titulo">Tu espacio</p>

        <a
            class="navegacion__opcion"
            routerLink="/publicaciones"
            routerLinkActive="navegacion__opcion--activa"
            ariaCurrentWhenActive="page"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                <path d="m3 10 9-7 9 7v11h-6v-8H9v8H3Z" />
            </svg>

            Publicaciones
        </a>

        <a
            class="navegacion__opcion"
            routerLink="/mi-perfil"
            routerLinkActive="navegacion__opcion--activa"
            ariaCurrentWhenActive="page"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="7" r="4" />
                <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
            </svg>

            Mi perfil
        </a>

        <div class="navegacion__separador"></div>

        @if (usuario()) {
            <a class="navegacion__opcion" routerLink="/login" (click)="cerrarSesion()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 4H4v16h6M9 12h12m-5-5 5 5-5 5" />
                </svg>

                Cerrar sesión
            </a>
        }
    </nav>

</aside>
